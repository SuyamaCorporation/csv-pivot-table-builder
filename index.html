<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV Pivot Table Builder</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .pivot-table th { background: #1e3a5f; }
  .pivot-table td, .pivot-table th { padding: 6px 12px; border: 1px solid #374151; white-space: nowrap; }
  .pivot-table tr:nth-child(even) td { background: #111827; }
  .pivot-table tr:hover td { background: #1f2937; }
  .pivot-table .row-header { background: #1a2e4a !important; font-weight: 600; color: #93c5fd; }
  .pivot-table .col-total { background: #14532d22 !important; font-weight: 600; color: #6ee7b7; }
  .pivot-table .row-total { background: #14532d22 !important; font-weight: 600; color: #6ee7b7; }
</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
<div class="max-w-5xl mx-auto px-4 py-8">
  <h1 class="text-3xl font-bold text-center mb-1">CSV Pivot Table Builder</h1>
  <p class="text-center text-gray-400 text-sm mb-8">Paste CSV data, configure dimensions, and generate a pivot table instantly.</p>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-5 mb-5">
    <!-- CSV Input -->
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-base font-semibold text-gray-300">CSV Data</h2>
        <button onclick="loadSample()" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg text-gray-300 transition-colors">Load Sample</button>
      </div>
      <textarea
        id="csv-input"
        rows="12"
        placeholder="Paste CSV here (with header row)..."
        class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2.5 text-sm text-white font-mono placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-y"
      ></textarea>
      <button onclick="parseCSV()" class="mt-3 w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-xl transition-colors">Parse CSV</button>
    </div>

    <!-- Controls -->
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5">
      <h2 class="text-base font-semibold text-gray-300 mb-4">Pivot Configuration</h2>

      <div class="space-y-4">
        <div>
          <label class="block text-sm text-gray-400 mb-1.5">Row Dimension</label>
          <select id="sel-row" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">— select column —</option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-1.5">Column Dimension</label>
          <select id="sel-col" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">— select column —</option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-1.5">Value Column</label>
          <select id="sel-val" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">— select column —</option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-1.5">Aggregation</label>
          <select id="sel-agg" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="sum">Sum</option>
            <option value="avg">Average</option>
            <option value="count">Count</option>
            <option value="min">Min</option>
            <option value="max">Max</option>
          </select>
        </div>
      </div>

      <button onclick="buildPivot()" class="mt-5 w-full bg-green-600 hover:bg-green-500 text-white font-semibold py-2.5 rounded-xl transition-colors">Build Pivot Table</button>

      <div id="parse-info" class="mt-3 text-xs text-gray-500"></div>
    </div>
  </div>

  <!-- Pivot Output -->
  <div id="pivot-container" class="bg-gray-900 border border-gray-800 rounded-2xl p-5 hidden">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-base font-semibold text-gray-300">Pivot Table</h2>
      <span id="pivot-info" class="text-xs text-gray-500"></span>
    </div>
    <div class="overflow-x-auto">
      <table id="pivot-table" class="pivot-table text-sm rounded-lg overflow-hidden w-full"></table>
    </div>
  </div>
</div>

<script>
const SAMPLE_CSV = `Region,Product,Quarter,Sales,Units
North,Widget A,Q1,12500,50
North,Widget A,Q2,14200,57
North,Widget B,Q1,9800,39
North,Widget B,Q2,11100,44
South,Widget A,Q1,8700,35
South,Widget A,Q2,10300,41
South,Widget B,Q1,7200,29
South,Widget B,Q2,8900,36
East,Widget A,Q1,15600,62
East,Widget A,Q2,13800,55
East,Widget B,Q1,12000,48
East,Widget B,Q2,14500,58
West,Widget A,Q1,9500,38
West,Widget A,Q2,11700,47
West,Widget B,Q1,8300,33
West,Widget B,Q2,10200,41`;

let parsedHeaders = [];
let parsedRows = [];

function loadSample() {
  document.getElementById('csv-input').value = SAMPLE_CSV;
  parseCSV();
}

function parseCSV() {
  const raw = document.getElementById('csv-input').value.trim();
  if (!raw) { alert('Please paste some CSV data first.'); return; }

  const lines = raw.split('\n').map(l => l.trim()).filter(l => l);
  if (lines.length < 2) { alert('CSV must have a header row and at least one data row.'); return; }

  // Parse headers
  parsedHeaders = parseCSVLine(lines[0]);
  parsedRows = lines.slice(1).map(line => {
    const vals = parseCSVLine(line);
    const row = {};
    parsedHeaders.forEach((h, i) => { row[h] = vals[i] !== undefined ? vals[i] : ''; });
    return row;
  });

  // Populate selects
  ['sel-row','sel-col','sel-val'].forEach(id => {
    const sel = document.getElementById(id);
    sel.innerHTML = '<option value="">— select column —</option>' +
      parsedHeaders.map(h => `<option value="${escapeAttr(h)}">${escapeHtml(h)}</option>`).join('');
  });

  // Smart defaults
  if (parsedHeaders.length >= 3) {
    document.getElementById('sel-row').value = parsedHeaders[0];
    document.getElementById('sel-col').value = parsedHeaders[1];
    document.getElementById('sel-val').value = parsedHeaders[parsedHeaders.length - 1];
  }

  document.getElementById('parse-info').textContent =
    `Parsed ${parsedRows.length} rows × ${parsedHeaders.length} columns`;
}

function parseCSVLine(line) {
  const result = [];
  let cur = '', inQuote = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') {
      if (inQuote && line[i+1] === '"') { cur += '"'; i++; }
      else { inQuote = !inQuote; }
    } else if (c === ',' && !inQuote) {
      result.push(cur.trim()); cur = '';
    } else {
      cur += c;
    }
  }
  result.push(cur.trim());
  return result;
}

function buildPivot() {
  const rowDim = document.getElementById('sel-row').value;
  const colDim = document.getElementById('sel-col').value;
  const valCol = document.getElementById('sel-val').value;
  const agg    = document.getElementById('sel-agg').value;

  if (!rowDim || !colDim || !valCol) {
    alert('Please select Row Dimension, Column Dimension, and Value Column.');
    return;
  }
  if (rowDim === colDim) {
    alert('Row and Column dimensions must be different columns.');
    return;
  }
  if (parsedRows.length === 0) {
    alert('No data parsed yet. Click "Parse CSV" first.');
    return;
  }

  // Collect unique row/col values
  const rowVals = [...new Set(parsedRows.map(r => r[rowDim]))].sort();
  const colVals = [...new Set(parsedRows.map(r => r[colDim]))].sort();

  // Build cell buckets
  const buckets = {};
  rowVals.forEach(rv => {
    buckets[rv] = {};
    colVals.forEach(cv => { buckets[rv][cv] = []; });
  });

  parsedRows.forEach(row => {
    const rv = row[rowDim];
    const cv = row[colDim];
    const v  = parseFloat(row[valCol]);
    if (buckets[rv] && buckets[rv][cv] !== undefined) {
      buckets[rv][cv].push(isNaN(v) ? (agg === 'count' ? 1 : null) : v);
    }
  });

  function aggVals(vals) {
    const nums = vals.filter(v => v !== null);
    if (agg === 'count') return vals.length;
    if (nums.length === 0) return '-';
    if (agg === 'sum') return nums.reduce((a,b) => a+b, 0);
    if (agg === 'avg') return (nums.reduce((a,b) => a+b, 0) / nums.length);
    if (agg === 'min') return Math.min(...nums);
    if (agg === 'max') return Math.max(...nums);
    return '-';
  }

  function fmt(v) {
    if (v === '-') return '-';
    if (agg === 'count') return v;
    if (typeof v === 'number') {
      return agg === 'avg' ? v.toFixed(2) : v.toLocaleString(undefined, { maximumFractionDigits: 2 });
    }
    return v;
  }

  // Build table HTML
  const aggLabel = { sum:'Sum', avg:'Avg', count:'Count', min:'Min', max:'Max' }[agg];
  let html = '<thead><tr>';
  html += `<th class="text-left text-blue-300">${escapeHtml(rowDim)} \\ ${escapeHtml(colDim)}</th>`;
  colVals.forEach(cv => { html += `<th class="text-right text-gray-300">${escapeHtml(cv)}</th>`; });
  html += `<th class="text-right text-green-400">Total</th>`;
  html += '</tr></thead><tbody>';

  // Grand totals by col
  const colTotals = {};
  colVals.forEach(cv => { colTotals[cv] = []; });
  let grandTotal = [];

  rowVals.forEach(rv => {
    html += '<tr>';
    html += `<td class="row-header">${escapeHtml(rv)}</td>`;
    let rowAllVals = [];
    colVals.forEach(cv => {
      const vals = buckets[rv][cv];
      const v = aggVals(vals);
      html += `<td class="text-right">${fmt(v)}</td>`;
      const nums = vals.filter(x => x !== null);
      colTotals[cv].push(...nums);
      rowAllVals.push(...nums);
      grandTotal.push(...nums);
    });
    const rowT = aggVals(rowAllVals.map(x => x));
    html += `<td class="text-right row-total">${fmt(rowT)}</td>`;
    html += '</tr>';
  });

  // Footer totals row
  html += '<tr>';
  html += `<td class="col-total">Total</td>`;
  colVals.forEach(cv => {
    const v = aggVals(colTotals[cv]);
    html += `<td class="text-right col-total">${fmt(v)}</td>`;
  });
  html += `<td class="text-right col-total">${fmt(aggVals(grandTotal))}</td>`;
  html += '</tr></tbody>';

  document.getElementById('pivot-table').innerHTML = html;
  document.getElementById('pivot-info').textContent =
    `${rowVals.length} rows × ${colVals.length} columns · ${aggLabel}(${valCol})`;

  const container = document.getElementById('pivot-container');
  container.classList.remove('hidden');
  container.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeAttr(str) {
  return String(str).replace(/"/g,'&quot;');
}

// Auto-load sample on page load
window.addEventListener('load', loadSample);
</script>
</body>
</html>
